name: Build Twoyi Custom ROM & APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Rust & Cargo-XDK
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Build Dependencies & NDK r22b
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full make
          cargo install cargo-xdk || true
          wget -q https://dl.google.com/android/repository/android-ndk-r22b-linux-x86_64.zip
          unzip -q android-ndk-r22b-linux-x86_64.zip -d $HOME
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r22b" >> $GITHUB_ENV
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Step 1 - Extract & Patch ROM
        run: make rom

      - name: Step 2 - Compile Native Rust Subsystems
        run: make native
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Step 3 - Assemble Release APK
        run: make apk

      - name: Step 4 - Align & Sign APK
        run: make sign

      - name: Step 5 - Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Twoyi-Custom-Build
          path: build/dist/*
