name: Build Twoyi Custom ROM & APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Rust & Cargo-XDK
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Toolchain Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          cargo install cargo-xdk || true
          chmod +x gradlew || true

      - name: Install Android NDK r22b & Build Tools
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r22b-linux-x86_64.zip
          unzip -q android-ndk-r22b-linux-x86_64.zip -d $HOME
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r22b" >> $GITHUB_ENV
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Run Go Orchestrator
        run: |
          go run main.go -ndk=$ANDROID_NDK_HOME

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Twoyi-Custom-Build
          path: build/dist/*
